<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .actor-card { fill: #f8fafc; stroke: #2563eb; stroke-width: 1.8; rx: 8; }
      .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle; }
      .actor-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      
      .boundary { fill: #f0fdf4; stroke: #0284c7; stroke-width: 1.8; stroke-dasharray: 6 4; rx: 14; }
      .boundary-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0369a1; }
      
      .uc-pill { fill: #ffffff; stroke: #0284c7; stroke-width: 1.5; rx: 24; }
      .uc-core { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; rx: 24; }
      .uc-admin { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 24; }
      .uc-expert { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.5; rx: 24; }
      
      .uc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .uc-text-core { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      
      .dep-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #0284c7; font-weight: 600; text-anchor: middle; }
      .line-assoc { stroke: #334155; stroke-width: 1.6; fill: none; }
      .line-dep { stroke: #0284c7; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Solid White Background -->
  <rect width="1150" height="780" class="bg" rx="10" />

  <!-- Title Header -->
  <text x="575" y="38" class="title" text-anchor="middle">CareerLens — Use Case Diagram</text>
  <text x="575" y="60" class="subtitle" text-anchor="middle">Structured user workflows, analytical dependencies, catalog maintenance, and evaluation</text>

  <!-- System Boundary -->
  <rect x="280" y="85" width="830" height="660" class="boundary" />
  <text x="305" y="115" class="boundary-title">System Boundary: CareerLens Platform (MVP Scope)</text>

  <!-- ACTORS (Left Column) -->
  <rect x="30" y="160" width="210" height="110" class="actor-card" />
  <text x="135" y="200" class="actor-title">User</text>
  <text x="135" y="222" class="actor-sub">Student / Graduate /</text>
  <text x="135" y="238" class="actor-sub">Early-Career Professional</text>

  <rect x="30" y="520" width="210" height="80" class="actor-card" />
  <text x="135" y="555" class="actor-title">Administrator</text>
  <text x="135" y="575" class="actor-sub">Project Team / Catalog Admin</text>

  <rect x="30" y="635" width="210" height="80" class="actor-card" />
  <text x="135" y="670" class="actor-title">Independent Expert</text>
  <text x="135" y="690" class="actor-sub">Academic / Industry Evaluator</text>

  <!-- USE CASES -->

  <!-- Top Row: Input Use Cases (Side-by-side, no vertical obstruction) -->
  <rect x="320" y="145" width="280" height="50" class="uc-pill" />
  <text x="460" y="176" class="uc-text">UC-01: Enter / Update Skill Profile</text>

  <rect x="670" y="145" width="280" height="50" class="uc-pill" />
  <text x="810" y="176" class="uc-text">UC-02: Select Target Software Role</text>

  <!-- Middle Row: Central Processing Action -->
  <rect x="475" y="255" width="320" height="56" class="uc-core" />
  <text x="635" y="290" class="uc-text-core">UC-03: Run Skill-Gap Analysis</text>

  <!-- Output Row: Diagnostic and Roadmap Results -->
  <rect x="320" y="375" width="280" height="50" class="uc-pill" />
  <text x="460" y="406" class="uc-text">UC-04: View Prioritized Skill Gaps</text>

  <rect x="670" y="375" width="280" height="50" class="uc-pill" />
  <text x="810" y="406" class="uc-text">UC-05: View Learning Roadmaps</text>

  <!-- Explanation Row -->
  <rect x="475" y="470" width="320" height="50" class="uc-pill" />
  <text x="635" y="501" class="uc-text">UC-06: Review Analysis Explanation</text>

  <!-- Admin & Evaluation Row -->
  <rect x="320" y="570" width="310" height="50" class="uc-admin" />
  <text x="475" y="601" class="uc-text" fill="#854d0e">UC-07: Maintain Role &amp; Skill Catalogue</text>

  <rect x="670" y="650" width="310" height="50" class="uc-expert" />
  <text x="825" y="681" class="uc-text" fill="#9d174d">UC-08: Evaluate Sample Results</text>

  <!-- ACTOR ASSOCIATIONS (Clean direct lines, zero node crossing) -->
  <!-- User to UC-01, UC-03, UC-04 -->
  <line x1="240" y1="190" x2="320" y2="170" class="line-assoc" />
  <line x1="240" y1="215" x2="475" y2="275" class="line-assoc" />
  <line x1="240" y1="240" x2="320" y2="390" class="line-assoc" />

  <!-- Admin to UC-07 -->
  <line x1="240" y1="560" x2="320" y2="590" class="line-assoc" />

  <!-- Expert to UC-08 -->
  <line x1="240" y1="675" x2="670" y2="675" class="line-assoc" />

  <!-- INTERNAL USE-CASE DEPENDENCIES (Clear diagonal arrows with NO crossing through nodes) -->
  <!-- UC-03 includes UC-01 (arrow points to UC-01) -->
  <path d="M 570 255 L 500 195" class="line-dep" />
  <text x="500" y="235" class="dep-text">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-03 includes UC-02 (arrow points to UC-02) -->
  <path d="M 700 255 L 770 195" class="line-dep" />
  <text x="765" y="235" class="dep-text">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-03 outputs to UC-04 -->
  <path d="M 570 311 L 500 375" class="line-dep" />
  <text x="500" y="340" class="dep-text">output gaps</text>

  <!-- UC-03 outputs to UC-05 -->
  <path d="M 700 311 L 770 375" class="line-dep" />
  <text x="765" y="340" class="dep-text">prioritized</text>

  <!-- UC-04 extends into UC-06 (explanation) -->
  <path d="M 500 425 L 570 470" class="line-dep" />
  <text x="500" y="460" class="dep-text">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC-05 references UC-06 -->
  <path d="M 770 425 L 700 470" class="line-dep" />
  <text x="765" y="460" class="dep-text">explains</text>
</svg>
