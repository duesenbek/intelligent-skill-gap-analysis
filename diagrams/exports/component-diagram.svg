<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .tier { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 10; }
      .tier-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #334155; }
      .comp { fill: #ffffff; stroke: #0284c7; stroke-width: 1.6; rx: 8; }
      .comp-core { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .db { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; rx: 8; }
      .text-comp { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .text-comp-core { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      .text-db { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; text-anchor: middle; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .arrow { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow-slate); }
      .arrow-blue { stroke: #2563eb; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Solid Canvas Background -->
  <rect width="1020" height="660" class="bg" rx="10" />

  <!-- Title Header -->
  <text x="510" y="38" class="title" text-anchor="middle">CareerLens — Draft Component Diagram (Logical Architecture)</text>
  <text x="510" y="60" class="subtitle" text-anchor="middle">Separation of UI, API coordination, core analysis/recommendation engines, and data storage</text>

  <!-- Client Tier -->
  <rect x="40" y="90" width="940" height="95" class="tier" />
  <text x="60" y="115" class="tier-label">Client Tier (Web Browser)</text>
  
  <rect x="80" y="125" width="230" height="48" class="comp" />
  <text x="195" y="154" class="text-comp">User Web Browser</text>

  <rect x="410" y="125" width="270" height="48" class="comp" />
  <text x="545" y="154" class="text-comp">Responsive Web UI (SPA)</text>

  <!-- Application Tier -->
  <rect x="40" y="215" width="940" height="280" class="tier" />
  <text x="60" y="238" class="tier-label">Application Tier (Backend API &amp; Analytical Engine)</text>

  <rect x="410" y="248" width="270" height="48" class="comp" />
  <text x="545" y="277" class="text-comp">Backend API Service (FastAPI)</text>

  <!-- Application Subcomponents -->
  <rect x="65" y="325" width="190" height="48" class="comp" />
  <text x="160" y="354" class="text-comp">Input Validation</text>

  <rect x="280" y="325" width="210" height="48" class="comp" />
  <text x="385" y="354" class="text-comp">Skill Profile Service</text>

  <rect x="515" y="325" width="240" height="48" class="comp" />
  <text x="635" y="354" class="text-comp">Role &amp; Skill Catalogue Svc</text>

  <rect x="780" y="325" width="180" height="48" class="comp" />
  <text x="870" y="354" class="text-comp">Results Presenter</text>

  <!-- Analytical Engine Core Box -->
  <rect x="190" y="405" width="670" height="72" class="tier" fill="#eff6ff" stroke="#3b82f6" />
  <text x="210" y="425" class="label" font-weight="bold" fill="#1e40af">Core Analytical Logic (Explainable Heuristic Engine)</text>

  <rect x="220" y="430" width="240" height="40" class="comp-core" />
  <text x="340" y="455" class="text-comp-core">Skill-Gap Analysis Engine</text>

  <rect x="490" y="430" width="220" height="40" class="comp-core" />
  <text x="600" y="455" class="text-comp-core">Recommendation Engine</text>

  <rect x="735" y="430" width="110" height="40" class="comp-core" />
  <text x="790" y="455" class="text-comp-core">Eval Module</text>

  <!-- Data Tier -->
  <rect x="40" y="520" width="940" height="110" class="tier" />
  <text x="60" y="542" class="tier-label">Data &amp; Persistence Tier</text>

  <rect x="80" y="558" width="260" height="52" class="db" />
  <text x="210" y="590" class="text-db">Application Database</text>

  <rect x="380" y="558" width="280" height="52" class="db" />
  <text x="520" y="590" class="text-db">Curated Role &amp; Skill Catalog (ESCO)</text>

  <rect x="700" y="558" width="250" height="52" class="db" />
  <text x="825" y="590" class="text-db">Curated Learning Links</text>

  <!-- Connectors -->
  <line x1="310" y1="149" x2="410" y2="149" class="arrow" />
  <line x1="545" y1="173" x2="545" y2="248" class="arrow" />

  <line x1="470" y1="296" x2="180" y2="325" class="arrow" />
  <line x1="510" y1="296" x2="400" y2="325" class="arrow" />
  <line x1="580" y1="296" x2="620" y2="325" class="arrow" />
  <line x1="640" y1="296" x2="820" y2="325" class="arrow" />

  <line x1="385" y1="373" x2="340" y2="430" class="arrow-blue" />
  <line x1="635" y1="373" x2="400" y2="430" class="arrow-blue" />
  <line x1="460" y1="450" x2="490" y2="450" class="arrow-blue" />
  <line x1="710" y1="450" x2="735" y2="450" class="arrow-blue" />

  <line x1="320" y1="373" x2="230" y2="558" class="arrow" />
  <line x1="635" y1="373" x2="520" y2="558" class="arrow" />
  <line x1="600" y1="470" x2="800" y2="558" class="arrow" />
</svg>
